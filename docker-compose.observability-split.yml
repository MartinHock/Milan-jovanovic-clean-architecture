name: clean-architecture-observability-split
services:
  collector:
    image: otel/opentelemetry-collector-contrib:0.141.0
    command: ['--config=/etc/otelcol-contrib/config.yaml']
    volumes:
      - ./observability/split/collector.yml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - '127.0.0.1:14317:4317'
      - '127.0.0.1:14318:4318'
  loki:
    image: grafana/loki:3.6.2
    command: ['-config.file=/etc/loki/local-config.yaml']
    volumes:
      - ./observability/split/loki.yml:/etc/loki/local-config.yaml:ro
  tempo:
    image: grafana/tempo:2.9.0
    command: ['-config.file=/etc/tempo.yaml']
    volumes:
      - ./observability/split/tempo.yml:/etc/tempo.yaml:ro
  prometheus:
    image: prom/prometheus:v3.7.3
    volumes:
      - ./observability/split/prometheus.yml:/etc/prometheus/prometheus.yml:ro
  grafana:
    image: grafana/grafana:12.3.0
    ports:
      - '127.0.0.1:13300:3000'
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./observability/split/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
